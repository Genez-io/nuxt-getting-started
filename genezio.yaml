# The name of the project.
name: nuxt-getting-started
# The region where the project is deployed.
region: us-east-1
# The version of the Genezio YAML configuration to parse.
yamlVersion: 2
nuxt:
    # The path to the Nuxt project.
    path: .
    # The package manager to use.
    packageManager: npm
    # The scripts to run.
    scripts:
        deploy:
            - npm install
